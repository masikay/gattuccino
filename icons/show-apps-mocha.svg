<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Show applications (mocha)</title>
  <!-- Drawn for the 48 pixel icons of the dock, on whole pixels, so that the edges are sharp at 48 and at
       96 (a screen scaled to 200%). The 12 pixel squares and 4 pixel gaps stay on the pixel grid. -->
  <rect x="2" y="2" width="12" height="12" rx="3" fill="#f38ba8"/>
  <rect x="18" y="2" width="12" height="12" rx="3" fill="#fab387"/>
  <rect x="34" y="2" width="12" height="12" rx="3" fill="#f9e2af"/>
  <rect x="2" y="18" width="12" height="12" rx="3" fill="#a6e3a1"/>
  <rect x="18" y="18" width="12" height="12" rx="3" fill="#94e2d5"/>
  <rect x="34" y="18" width="12" height="12" rx="3" fill="#74c7ec"/>
  <rect x="2" y="34" width="12" height="12" rx="3" fill="#89b4fa"/>
  <rect x="18" y="34" width="12" height="12" rx="3" fill="#cba6f7"/>
  <rect x="34" y="34" width="12" height="12" rx="3" fill="#f5c2e7"/>
</svg>
