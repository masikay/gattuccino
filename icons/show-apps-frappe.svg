<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Show applications (frappe)</title>
  <!-- Drawn for the 48 pixel icons of the dock, on whole pixels, so that the edges are sharp at 48 and at
       96 (a screen scaled to 200%). The 12 pixel squares and 4 pixel gaps stay on the pixel grid. -->
  <rect x="2" y="2" width="12" height="12" rx="3" fill="#e78284"/>
  <rect x="18" y="2" width="12" height="12" rx="3" fill="#ef9f76"/>
  <rect x="34" y="2" width="12" height="12" rx="3" fill="#e5c890"/>
  <rect x="2" y="18" width="12" height="12" rx="3" fill="#a6d189"/>
  <rect x="18" y="18" width="12" height="12" rx="3" fill="#81c8be"/>
  <rect x="34" y="18" width="12" height="12" rx="3" fill="#85c1dc"/>
  <rect x="2" y="34" width="12" height="12" rx="3" fill="#8caaee"/>
  <rect x="18" y="34" width="12" height="12" rx="3" fill="#ca9ee6"/>
  <rect x="34" y="34" width="12" height="12" rx="3" fill="#f4b8e4"/>
</svg>
